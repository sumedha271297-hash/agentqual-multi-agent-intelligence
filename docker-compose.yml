services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentqual
      POSTGRES_USER: agentqual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentqual -d agentqual"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agentqual_pgdata:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://agentqual:${POSTGRES_PASSWORD:-local_development_only}@postgres:5432/agentqual
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
volumes:
  agentqual_pgdata:
