name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentqual
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: agentqual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentqual -d agentqual"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentqual:ci_password@localhost:5432/agentqual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.evaluate
      - run: python -m scripts.evaluate_rubric
      - run: python -m scripts.evaluate_v2
      - run: python -m scripts.blind_review packet --out reports/annotation_packet
      - run: python -m scripts.demo
      - run: python -m scripts.security_matrix
      - run: python -m scripts.performance_smoke
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: offline-verified-evidence
          path: |
            reports/demo_trace.json
            reports/eval_v2.json
            reports/annotation_packet/blind_cases.csv
            reports/security_matrix.json
            reports/performance_smoke.json
          retention-days: 14
