name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentqual
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: agentqual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentqual -d agentqual"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentqual:ci_password@localhost:5432/agentqual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.evaluate
      - run: python -m scripts.evaluate_rubric
