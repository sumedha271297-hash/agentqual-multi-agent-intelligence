name: Verified Staging and Browser Walkthrough
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/**'
      - 'deploy/**'
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'scripts/staging_probe.py'
      - 'scripts/staging_recovery.py'
      - 'scripts/https_rehearsal.py'
      - 'scripts/record_browser.py'
      - '.github/workflows/staging-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-staging:
    name: Real Docker Compose staging and auth probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ephemeral CI-only fake credentials; never use in any public deployment.
      POSTGRES_PASSWORD: test_only_staging_9e4ee1
      AGENTQUAL_TENANT_TOKENS: '{"tenant-a":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","tenant-b":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}'
      STAGING_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate ephemeral localhost TLS certificate
        run: |
          mkdir -p deploy/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout deploy/tls/server.key -out deploy/tls/server.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Build API, PostgreSQL and HTTPS ingress
        run: docker compose -f deploy/staging.compose.yml -f deploy/tls-rehearsal.compose.yml up -d --build --wait
      - name: Auth, tenancy and approval probes over real HTTP
        run: python -m scripts.staging_probe
      - name: Verify trusted ephemeral TLS, ingress rate limiting and metrics
        run: python -m scripts.https_rehearsal
      - name: Persist a pending human approval
        run: python -m scripts.staging_recovery prepare
      - name: Restart actual API container, preserving PostgreSQL
        run: docker compose -f deploy/staging.compose.yml -f deploy/tls-rehearsal.compose.yml restart api
      - name: Verify checkpoint after process restart
        run: python -m scripts.staging_recovery resume
      - name: Prepare a second pending approval before database restore
        run: python -m scripts.staging_recovery prepare
      - name: Back up and RESTORE the real PostgreSQL checkpoint database
        run: |
          set -euo pipefail
          docker compose -f deploy/staging.compose.yml -f deploy/tls-rehearsal.compose.yml stop api gateway
          docker compose -f deploy/staging.compose.yml exec -T postgres pg_dump -U agentqual -Fc -d agentqual > /tmp/agentqual-ci.dump
          test -s /tmp/agentqual-ci.dump
          docker compose -f deploy/staging.compose.yml exec -T postgres psql -U agentqual -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE agentqual WITH (FORCE);'
          docker compose -f deploy/staging.compose.yml exec -T postgres psql -U agentqual -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE agentqual;'
          docker compose -f deploy/staging.compose.yml exec -T postgres pg_restore -U agentqual -d agentqual --exit-on-error < /tmp/agentqual-ci.dump
          rm -f /tmp/agentqual-ci.dump
          docker compose -f deploy/staging.compose.yml -f deploy/tls-rehearsal.compose.yml up -d api gateway --wait
      - name: Verify pending approval survived database restore
        run: python -m scripts.staging_recovery resume
      - name: Capture container logs for failed jobs
        if: failure()
        run: docker compose -f deploy/staging.compose.yml -f deploy/tls-rehearsal.compose.yml logs --tail=100
      - name: Tear down all test containers and volumes
        if: always()
        run: docker compose -f deploy/staging.compose.yml -f deploy/tls-rehearsal.compose.yml down -v --remove-orphans

  recorded-browser-demo:
    name: Genuine Chromium screen recording
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app and real browser automation
        run: |
          pip install -r requirements-dev.txt playwright==1.64.1 imageio-ffmpeg
          python -m playwright install --with-deps chromium
      - name: Start real FastAPI server on loopback
        run: |
          APP_ENV=development python -m uvicorn app.api:app --host 127.0.0.1 --port 8000 > /tmp/agentqual-browser-server.log 2>&1 &
          echo $! > /tmp/agentqual-browser-server.pid
          python - <<'PY'
          import time,urllib.request
          for i in range(50):
              try:
                  if urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=1).status==200: break
              except Exception: time.sleep(.2)
          else: raise RuntimeError("Local FastAPI did not start")
          PY
      - name: Record real user interactions and verify assertions
        run: python -m scripts.record_browser
      - name: Convert actual browser video to MP4
        run: |
          mkdir -p reports/browser
          VIDEO=$(find reports/browser -type f -name '*.webm' | head -n 1)
          test -n "$VIDEO"
          FFMPEG=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FFMPEG" -y -i "$VIDEO" -c:v libx264 -pix_fmt yuv420p -movflags +faststart reports/browser/agentqual_real_browser_demo.mp4
          test -s reports/browser/agentqual_real_browser_demo.mp4
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agentqual-genuine-browser-recording
          path: reports/browser/
          retention-days: 30
      - name: Print server logs on failure
        if: failure()
        run: cat /tmp/agentqual-browser-server.log || true
