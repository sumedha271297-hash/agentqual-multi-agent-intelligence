# CI-only localhost HTTPS ingress; generated certs are never committed.
services:
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./tls/server.key:/etc/nginx/tls/server.key:ro
    networks:
      - internal
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
